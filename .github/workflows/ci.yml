name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime dependencies
        run: pip install -r requirements.txt

      - name: Import check
        run: python -c "from app.core.identity import APP_DISPLAY_NAME, GITHUB_REPO; print(APP_DISPLAY_NAME, GITHUB_REPO)"
