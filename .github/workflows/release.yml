name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    environment: release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: pip install -r requirements-build.txt

      - name: Build Windows exe
        run: python build_app.py

      - name: Package zip
        shell: pwsh
        run: Compress-Archive -LiteralPath dist/AimSyncCS2Makcu.exe -DestinationPath dist/AimSyncCS2Makcu.zip -Force

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/AimSyncCS2Makcu.exe
            dist/AimSyncCS2Makcu.zip
          generate_release_notes: true
